name: Build and deploy NovaPunk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-output
          path: out
          include-hidden-files: true
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hosting-output
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0
      - name: Authenticate with Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: projects/1078070273018/locations/global/workloadIdentityPools/github-homepage/providers/github-actions
          service_account: github-novapunk-homepage@novapunk-homepage.iam.gserviceaccount.com
          # Verify token exchange here so IAM/API errors are visible before deployment.
          token_format: access_token
      - name: Check Firebase project access
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const project = process.env.FIREBASE_PROJECT_ID;
          const response = await fetch(`https://firebase.googleapis.com/v1beta1/projects/${encodeURIComponent(project)}`, {
            headers: { Authorization: `Bearer ${process.env.GOOGLE_ACCESS_TOKEN}` },
          });
          const body = await response.json();
          console.log(`Firebase project lookup HTTP ${response.status}`);
          if (!response.ok) {
            console.error(JSON.stringify(body.error ?? body, null, 2));
            process.exit(1);
          }
          console.log(`Verified Firebase project: ${body.projectId}`);
          NODE
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
